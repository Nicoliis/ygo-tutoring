<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGO Tutoring Toolkit · Profiles</title>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="draft/draft-base.css">
<link rel="stylesheet" href="draft/draft-buttons.css">
<link rel="stylesheet" href="welcome.css">
<link rel="stylesheet" href="shared/areas.css">
<link rel="stylesheet" href="shared/nav-layout.css">
<link rel="stylesheet" href="shared/nav-links.css">
<link rel="stylesheet" href="shared/nav-responsive.css">
</head>
<body>
<div id="welcomeRoot">
  <header class="app-header">
    <h1>YGO Tutoring Toolkit</h1>
    <p class="subtitle">Choose who is playing, or create a new profile.</p>
  </header>

  <main>
    <section class="profiles-section" aria-labelledby="profilesHeading">
      <h2 id="profilesHeading">Profiles</h2>
      <div id="profileStatus" class="status" aria-live="polite"></div>
      <ul id="profileList" class="profile-list"></ul>

      <form id="createProfileForm" class="create-profile-form">
        <label for="profileNameInput">New profile</label>
        <input type="text" id="profileNameInput" class="search-input" maxlength="40" placeholder="Profile name" autocomplete="off">
        <label for="profileModeSelect" class="visually-hidden">Game mode</label>
        <select id="profileModeSelect" aria-label="Game mode"></select>
        <button type="submit" class="btn btn-primary">Create profile</button>
      </form>
      <button type="button" id="importSaveBtn" class="btn btn-secondary">Import save file</button>
    </section>

  </main>
</div>

<script src="shared/dialogs.js"></script>
<script src="shared/areas.js"></script>
<script src="shared/nav-entries.js"></script>
<script src="shared/save-utils.js"></script>
<script src="shared/profiles.js"></script>
<script src="shared/savefile.js"></script>
<script src="shared/nav-collapse-state.js"></script>
<script src="shared/nav-sidebar-item.js"></script>
<script src="shared/nav-sidebar.js"></script>
<script src="shared/nav-init.js"></script>
<script src="draft/mainline-boosters.js"></script>
<script src="progression/progression-state.js"></script>
<script src="shared/profile-picker.js"></script>
</body>
</html>
